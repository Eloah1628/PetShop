<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<body>
    <div class="auth-container">
        <form id="cadastroForm" class="auth-box">
            <h2>Criar Conta</h2>
            <div id="mensagemErro" class="error-msg" style="display: none;"></div>
            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Seu nome">
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="input-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00">
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Sua senha">
            </div>

            <button type="submit" class="btn">Cadastrar</button>
            <p class="auth-link">Já tem uma conta? <a href="login.html">Faça login</a></p>
        </form>
    </div>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const cpf = document.getElementById('cpf').value;
            const senha = document.getElementById('senha').value;
            const erroDiv = document.getElementById('mensagemErro');

            try {
                const resposta = await fetch('/hello/usuario', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha, cpf })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    alert('Cadastro realizado com sucesso! Faça login.');
                    window.location.href = 'login.html';
                } else {
                    erroDiv.style.display = 'block';
                    erroDiv.textContent = dados.msg || 'Erro ao cadastrar usuário.';
                }
            } catch (err) {
                erroDiv.style.display = 'block';
                erroDiv.textContent = 'Erro de conexão com o servidor.';
            }
        });
    </script>
</body>
</html>
</body>
</html>
