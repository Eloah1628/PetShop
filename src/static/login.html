<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Luzzie - Login</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="auth-container">
        <form id="loginForm" class="auth-box">
            <h2>Entrar no PetShop Luzzie</h2>
            <div id="mensagemErro" class="error-msg" style="display: none;"></div>
            
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Sua senha">
            </div>

            <button type="submit" class="btn">Entrar</button>
            <p class="auth-link">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const erroDiv = document.getElementById('mensagemErro');

            try {
                const resposta = await fetch('/hello/usuario/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    localStorage.setItem('token', dados.token);
                    alert(dados.msg);
                    window.location.href = 'index.html';
                } else {
                    erroDiv.style.display = 'block';
                    erroDiv.textContent = dados.msg || 'Erro ao realizar login.';
                }
            } catch (err) {
                erroDiv.style.display = 'block';
                erroDiv.textContent = 'Erro de conexão com o servidor.';
            }
        });
    </script>
</body>
</html>
