<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Luzzie - Cadastro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="logo">PetShop Luzzie</div>
        <nav>
            <a href="/">Início</a>
            <a href="/login">Login</a>
        </nav>
    </header>

    <main class="container">
        <div class="auth-container">
            <form id="cadastroForm" class="auth-box">
                <h2>Criar Conta</h2>
                <div id="mensagemErro" class="error-msg" style="display: none;"></div>

                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Seu nome">
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>

                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" required placeholder="000.000.000-00">
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="Sua senha">
                </div>

                <button type="submit" class="btn">Cadastrar</button>
                <p class="auth-link">Já tem uma conta? <a href="/login">Faça login</a></p>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PetShop Luzzie. Todos os direitos reservados.</p>
    </footer>

    <script src="/js/script.js"></script>
</body>
</html>
