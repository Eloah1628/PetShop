<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Luzzie - Início</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="logo">PetShop Luzzie</div>
        <nav>
            <a href="/">Início</a>
            <a href="/login">Login</a>
            <a href="/cadastro">Cadastro</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Bem-vindo ao PetShop Luzzie</h1>
            <p>O cuidado que o seu melhor amigo merece, com amor e dedicação.</p>
            <div class="buttons">
                <a href="/login" class="btn">Entrar</a>
                <a href="/cadastro" class="btn btn-outline">Cadastre-se</a>
            </div>
        </section>

        <section>
            <h2>Pets para adoção</h2>
            <div id="listaPets" class="grid"></div>
        </section>

        <section>
            <h2>Produtos</h2>
            <div id="listaProdutos" class="grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 PetShop Luzzie. Todos os direitos reservados.</p>
    </footer>

    <script src="/js/script.js"></script>
</body>
</html>
